name: Hourly tender ingest

on:
  schedule:
    - cron: '17 * * * *'      # 17 past the hour: away from the crowd on :00
  workflow_dispatch:
    inputs:
      since_days:
        description: 'How many days back to fetch'
        default: '2'

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Fetch and normalise
        run: |
          python3 ingest/run.py \
            --since-days "${{ github.event.inputs.since_days || 2 }}" \
            --out delta.ndjson
          wc -l delta.ndjson

      - name: Send to DreamHost and import
        env:
          DEPLOY_KEY: ${{ secrets.DREAMHOST_KEY }}
          DEPLOY_HOST: ${{ secrets.DREAMHOST_HOST }}
          DEPLOY_USER: ${{ secrets.DREAMHOST_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/actions_key
          chmod 600 ~/.ssh/actions_key
          ssh-keyscan -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # This key has no shell: the server only accepts 'upload-delta',
          # which stores stdin and runs the importer. See ops/actions-shell.sh.
          ssh -i ~/.ssh/actions_key -o BatchMode=yes -p 22 \
            "$DEPLOY_USER@$DEPLOY_HOST" upload-delta < delta.ndjson | tee import.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ingest run"
            echo '```'
            tail -n 1 delta.ndjson 2>/dev/null || echo "no delta produced"
            cat import.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

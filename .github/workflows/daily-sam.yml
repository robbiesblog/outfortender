name: Daily SAM.gov ingest

on:
  schedule:
    # SAM.gov regenerates its extract once a day. Twice a day gives a second
    # chance when GitHub skips a scheduled run, which it does often.
    - cron: '41 9,21 * * *'
  workflow_dispatch:
    inputs:
      since_days:
        description: 'How many days back to fetch'
        default: '3'

concurrency:
  group: ingest-sam
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Fetch and normalise
        id: fetch
        run: |
          set +e
          python3 ingest/run.py \
            --since-days "${{ github.event.inputs.since_days || 3 }}" \
            --only sam \
            --out delta.ndjson
          code=$?
          # 2 means some sources failed but we still have tenders worth importing.
          if [ "$code" = "2" ]; then
            echo "partial=true" >> "$GITHUB_OUTPUT"
            code=0
          fi
          wc -l delta.ndjson
          exit $code

      - name: Send to DreamHost and import
        env:
          DEPLOY_KEY: ${{ secrets.DREAMHOST_KEY }}
          DEPLOY_HOST: ${{ secrets.DREAMHOST_HOST }}
          DEPLOY_USER: ${{ secrets.DREAMHOST_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/actions_key
          chmod 600 ~/.ssh/actions_key
          ssh-keyscan -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # This key has no shell: the server only accepts 'upload-delta',
          # which stores stdin and runs the importer. See ops/actions-shell.sh.
          ssh -i ~/.ssh/actions_key -o BatchMode=yes -p 22 \
            "$DEPLOY_USER@$DEPLOY_HOST" upload-delta < delta.ndjson | tee import.log

      - name: Flag a partial run
        if: steps.fetch.outputs.partial == 'true'
        run: |
          echo "::warning title=Partial ingest::At least one source failed. \
          The delta was still imported; see the run log for which."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Ingest run"
            echo '```'
            tail -n 1 delta.ndjson 2>/dev/null || echo "no delta produced"
            cat import.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
